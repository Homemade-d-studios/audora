<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Step inside a story and listen to its characters come alive." />
    <title>Audora — Stories in conversation</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");

      :root {
        --ink: #171717;
        --muted: #6d6d68;
        --paper: #ffffff;
        --mockup-width: clamp(620px, 52vw, 760px);
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: var(--paper); }
      body {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow-x: hidden;
      }
      button { font: inherit; }

      .site-brand {
        position: absolute;
        z-index: 6;
        top: clamp(22px, 3.5vw, 42px);
        left: clamp(22px, 4vw, 58px);
        display: block;
        width: clamp(112px, 9vw, 146px);
      }
      .site-brand img {
        display: block;
        width: 100%;
        height: auto;
        transform: translateY(-8px);
      }
      .yc-badge {
        position: absolute;
        z-index: 6;
        top: calc(clamp(22px, 3.5vw, 42px) + 41px);
        left: calc(clamp(22px, 4vw, 58px) + 6px);
        display: flex;
        align-items: center;
        gap: 7px;
        color: #171717;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }
      .yc-badge img {
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 2px;
      }
      .sign-in-button {
        position: absolute;
        z-index: 6;
        top: clamp(22px, 3.5vw, 42px);
        right: clamp(22px, 4vw, 58px);
        display: grid;
        width: 112px;
        height: 50px;
        padding: 0 24px;
        place-items: center;
        border: 0;
        border-radius: 999px;
        color: #fff;
        background: #171717;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }
      .sign-in-button:hover { background: #323232; transform: translateY(-1px); }
      .sign-in-button:focus-visible { outline: 3px solid rgba(23, 23, 23, 0.22); outline-offset: 3px; }
      .hero-title {
        position: absolute;
        z-index: 2;
        top: clamp(40px, 6vh, 62px);
        left: 50%;
        width: min(92vw, 1000px);
        margin: 0;
        color: #171717;
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 4vw, 64px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 0.9;
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .hero-title span { display: block; }
      .hero-title .now-playing { margin-top: 0.04em; }

      .experience {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .carousel-window {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
      }
      .carousel-track {
        display: flex;
        width: max-content;
        will-change: transform;
        animation: drift 132s linear infinite;
      }
      .carousel-track.is-paused { animation-play-state: paused; }
      .carousel-set {
        display: flex;
        gap: clamp(24px, 2.5vw, 42px);
        padding-right: clamp(24px, 2.5vw, 42px);
      }

      .book {
        position: relative;
        flex: 0 0 auto;
        width: clamp(120px, 10.5vw, 164px);
        aspect-ratio: 0.68;
        overflow: hidden;
        border: 1px solid rgba(20, 20, 20, 0.14);
        border-radius: 5px 12px 12px 5px;
        box-shadow: 0 16px 28px rgba(28, 28, 24, 0.11), inset 8px 0 12px rgba(255, 255, 255, 0.18), inset -3px 0 0 rgba(0, 0, 0, 0.12);
        transform: perspective(700px) rotateY(5deg);
      }
      .book::before {
        position: absolute;
        z-index: 4;
        inset: 0 auto 0 0;
        width: 9px;
        border-right: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.12);
        content: "";
      }
      .book-cover {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 14px 14px 20px;
      }
      .book-cover-image {
        position: absolute;
        z-index: 3;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .book-kicker { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; opacity: 0.75; text-transform: uppercase; }
      .book-title {
        max-width: 95%;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 1.55vw, 25px);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .book-author { font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
      .cover-0 { color: #241d16; background: linear-gradient(155deg, #e9d9b9, #b99863); }
      .cover-1 { color: #f4ead8; background: linear-gradient(150deg, #435365, #152331); }
      .cover-2 { color: #2b1b22; background: linear-gradient(155deg, #dbb2b7, #965c6b); }
      .cover-3 { color: #14312c; background: linear-gradient(155deg, #c7e1d5, #6e9c87); }
      .cover-4 { color: #f5dfbb; background: linear-gradient(155deg, #774b3f, #2d2422); }
      .cover-5 { color: #283019; background: linear-gradient(155deg, #dbe2a1, #87964f); }
      .cover-6 { color: #fff0cf; background: linear-gradient(155deg, #ce713b, #71361e); }

      .phone-wrap {
        position: relative;
        z-index: 3;
        width: var(--mockup-width);
        aspect-ratio: 1376 / 1143;
      }

      .bottom-frost {
        position: absolute;
        z-index: 4;
        inset: 31% 0 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.025) 12%,
          rgba(255, 255, 255, 0.11) 25%,
          rgba(255, 255, 255, 0.3) 40%,
          rgba(255, 255, 255, 0.58) 56%,
          rgba(255, 255, 255, 0.86) 69%,
          #fff 78%,
          #fff 100%
        );
        -webkit-backdrop-filter: blur(58px) saturate(74%);
        backdrop-filter: blur(58px) saturate(74%);
        -webkit-mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.04) 10%,
          rgba(0, 0, 0, 0.14) 22%,
          rgba(0, 0, 0, 0.34) 36%,
          rgba(0, 0, 0, 0.62) 52%,
          rgba(0, 0, 0, 0.88) 66%,
          #000 76%,
          #000 100%
        );
        mask-image: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.04) 10%,
          rgba(0, 0, 0, 0.14) 22%,
          rgba(0, 0, 0, 0.34) 36%,
          rgba(0, 0, 0, 0.62) 52%,
          rgba(0, 0, 0, 0.88) 66%,
          #000 76%,
          #000 100%
        );
        transform: translateZ(0);
        pointer-events: none;
      }
      .phone-photo {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .screen-overlay {
        position: absolute;
        z-index: 2;
        top: 6.15%;
        left: 35.35%;
        width: 29.8%;
        height: 79%;
        overflow: hidden;
        border-radius: 14% / 6.4%;
        background: #fffdf7;
        box-shadow: inset 0 0 0 1px rgba(19, 19, 18, 0.08);
      }
      .screen-overlay::after {
        position: absolute;
        z-index: 4;
        bottom: 5px;
        left: 50%;
        width: 32%;
        height: 3px;
        border-radius: 999px;
        background: rgba(13, 13, 12, 0.85);
        content: "";
        transform: translateX(-50%);
        pointer-events: none;
      }
      .dynamic-island {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 50%;
        width: 35%;
        height: 17px;
        border-radius: 999px;
        background: #050505;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .dynamic-island::after {
        position: absolute;
        top: 5px;
        right: 7px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10151c;
        box-shadow: inset 0 0 0 1px rgba(69, 88, 111, 0.35);
        content: "";
      }
      .phone-screen { position: relative; z-index: 2; display: flex; height: 100%; flex-direction: column; padding: 38px 13px 18px; }
      .reader-stage { position: relative; min-height: 0; flex: 1; overflow: hidden; }
      .text-page { display: flex; height: 100%; flex-direction: column; }
      .page-scan { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top center; background: #fff; }
      .page-scan[hidden], .text-page[hidden] { display: none; }
      .phone-screen.has-page-image { padding: 0; overflow: hidden; }
      .phone-screen.has-page-image .reader-stage { position: absolute; inset: 0; }
      .phone-screen.has-page-image .page-scan { object-fit: cover; object-position: center top; }
      .phone-screen.has-page-image .player {
        position: absolute;
        z-index: 2;
        right: 13px;
        bottom: 18px;
        left: 13px;
        padding: 13px 8px 4px;
        border-top-color: rgba(36, 36, 32, 0.22);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(10px);
      }
      .page-folio { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid #d8d8d2; color: #8a8a84; font-family: Georgia, "Times New Roman", serif; font-size: 8px; font-style: italic; letter-spacing: 0.06em; }
      .story-heading { padding: 15px 0 10px; text-align: center; }
      .story-label { display: block; margin-bottom: 6px; color: #777770; font-family: Georgia, "Times New Roman", serif; font-size: 9px; font-style: italic; }
      .story-title { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(18px, 1.35vw, 22px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.05; }
      .story-title.is-long { font-size: clamp(14px, 1vw, 17px); line-height: 1.08; }
      .story-heading::after { display: block; margin-top: 8px; color: #898982; content: "❦"; font-family: Georgia, serif; font-size: 11px; }

      .dialogue { min-height: 0; flex: 1; color: #282823; font-family: Georgia, "Times New Roman", serif; font-size: clamp(9px, 0.68vw, 11px); line-height: 1.42; overflow: hidden; }
      .page-opening { margin: 0 0 10px; text-indent: 1.2em; }
      .page-opening::first-letter { float: left; margin: 0.06em 0.08em 0 0; font-size: 3.1em; line-height: 0.78; }
      .passage { margin: 0 0 9px; text-indent: 1.2em; transition: background 180ms ease; }
      .passage.is-speaking { border-radius: 3px; background: #f3efdc; }
      .attribution { color: #707069; font-size: 0.88em; font-style: italic; white-space: nowrap; }

      .player { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; padding-top: 11px; border-top: 1px solid #d8d8d2; }
      .play-button { display: grid; width: 36px; height: 36px; padding: 0; place-items: center; border: 0; border-radius: 50%; color: #fff; background: #1f211e; cursor: pointer; transition: transform 160ms ease, background 160ms ease; }
      .play-button:hover { background: #070807; transform: scale(1.04); }
      .play-button:focus-visible { outline: 3px solid rgba(57, 82, 62, 0.35); outline-offset: 3px; }
      .play-icon { width: 0; height: 0; margin-left: 3px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid currentColor; }
      .play-button.is-playing .play-icon { width: 11px; height: 13px; margin-left: 0; border: 0; border-right: 4px solid currentColor; border-left: 4px solid currentColor; }
      .player-copy { min-width: 0; }
      .player-status { display: block; margin-bottom: 7px; color: #5d5f59; font-size: 9px; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
      .waveform { display: flex; height: 16px; align-items: center; gap: 3px; }
      .waveform span { width: 3px; height: 4px; border-radius: 3px; background: #9b9d95; }
      .is-playing + .player-copy .waveform span { animation: pulse 700ms ease-in-out infinite alternate; }
      .waveform span:nth-child(2n) { height: 11px; animation-delay: -160ms !important; }
      .waveform span:nth-child(3n) { height: 7px; animation-delay: -320ms !important; }

      .audiobook-dock {
        position: absolute;
        z-index: 5;
        bottom: clamp(112px, 16vh, 148px);
        left: 50%;
        display: grid;
        width: min(250px, calc(100vw - 28px));
        min-height: 68px;
        grid-template-columns: 44px minmax(0, 1fr) 36px;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 0;
        border-radius: 16px;
        background: transparent;
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        transform: translateX(-50%);
      }
      .dock-cover {
        display: block;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 8px 18px rgba(22, 22, 20, 0.16);
      }
      .dock-copy { min-width: 0; }
      .dock-title {
        display: block;
        overflow: hidden;
        margin-bottom: 4px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.05;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dock-author {
        display: block;
        overflow: hidden;
        margin-bottom: 4px;
        color: #73736d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        font-weight: 400;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dock-wave {
        display: flex;
        height: 15px;
        align-items: center;
        gap: 2px;
      }
      .dock-wave span {
        width: 2px;
        height: 5px;
        border-radius: 999px;
        background: #9b9d95;
        transform-origin: center;
      }
      .dock-wave span:nth-child(2n) { height: 12px; animation-delay: -140ms !important; }
      .dock-wave span:nth-child(3n) { height: 8px; animation-delay: -280ms !important; }
      .audiobook-dock.is-playing .dock-wave span { animation: pulse 700ms ease-in-out infinite alternate; }
      .dock-play-button {
        display: grid;
        width: 36px;
        height: 36px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: #171717;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }
      .dock-play-button:hover { background: #323232; transform: scale(1.04); }
      .dock-play-button:focus-visible { outline: 3px solid rgba(23, 23, 23, 0.2); outline-offset: 3px; }
      .dock-play-button.is-playing .play-icon { width: 11px; height: 13px; margin-left: 0; border: 0; border-right: 4px solid currentColor; border-left: 4px solid currentColor; }
      .dock-caption {
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        width: max-content;
        margin: 0;
        color: #73736d;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.2;
        text-align: center;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      @keyframes drift { from { transform: translateX(-50%); } to { transform: translateX(0); } }
      @keyframes pulse { from { transform: scaleY(0.45); } to { transform: scaleY(1.35); } }

      @media (max-height: 760px) and (min-width: 700px) {
        :root { --mockup-width: 570px; }
      }
      @media (max-width: 620px) {
        :root { --mockup-width: 720px; }
        .experience { min-height: 680px; }
        .book { width: 112px; }
        .site-brand { width: 104px; }
        .site-brand img { transform: translateY(-6px); }
        .yc-badge { top: 58px; left: 28px; gap: 5px; font-size: 11px; }
        .yc-badge img { width: 17px; height: 17px; }
        .sign-in-button { width: 92px; height: 44px; padding: 0 16px; font-size: 14px; }
        .hero-title {
          top: 42px;
          width: 94vw;
          font-size: clamp(32px, 9vw, 42px);
          line-height: 0.92;
        }
        .bottom-frost { inset: 32% 0 0; }
        .audiobook-dock {
          bottom: 90px;
          width: min(240px, calc(100vw - 24px));
          min-height: 64px;
          grid-template-columns: 42px minmax(0, 1fr) 34px;
          gap: 7px;
          padding: 7px;
          border-radius: 15px;
        }
        .dock-cover { width: 42px; height: 42px; border-radius: 8px; }
        .dock-title { font-size: 13px; }
        .dock-author { margin-bottom: 4px; font-size: 8px; }
        .dock-wave { gap: 2px; }
        .dock-play-button { width: 34px; height: 34px; }
        .dock-caption { top: calc(100% + 5px); font-size: 9px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .carousel-track,
        .is-playing + .player-copy .waveform span,
        .audiobook-dock.is-playing .dock-wave span { animation-play-state: paused; }
      }
    </style>
  </head>
  <body>
    <main class="experience">
      <div class="site-brand">
        <img src="./assets/audora-logo-black.png" alt="Audora" />
      </div>
      <div class="yc-badge" aria-label="Backed by Y Combinator">
        <span>Backed by</span>
        <img src="./assets/yc-logo.png" alt="" aria-hidden="true" />
        <span>Y Combinator</span>
      </div>
      <button class="sign-in-button" type="button">Sign in</button>
      <h1 class="hero-title">
        <span>The voices in your head.</span>
        <span class="now-playing">Now playing.</span>
      </h1>

      <div class="carousel-window" aria-hidden="true">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>

      <div class="phone-wrap" aria-label="iPhone 16 Pro audiobook preview">
        <img
          class="phone-photo"
          src="./assets/phone-hand-blank.png"
          alt=""
          aria-hidden="true"
        />
        <div class="screen-overlay">
          <span class="dynamic-island" aria-hidden="true"></span>
          <div class="phone-screen">
            <div class="reader-stage">
              <div class="text-page" id="textPage">
                <div class="page-folio" aria-hidden="true">
                  <span>Chapter XII</span>
                  <span>147</span>
                </div>
                <div class="story-heading">
                  <span class="story-label" id="storyAuthor"></span>
                  <h2 class="story-title" id="storyTitle"></h2>
                </div>
                <div class="dialogue" id="dialogue" aria-live="polite"></div>
              </div>
              <img class="page-scan" id="pageScan" alt="" hidden />
            </div>
            <div class="player">
              <button class="play-button" id="playButton" type="button" aria-label="Play character dialogue">
                <span class="play-icon" aria-hidden="true"></span>
              </button>
              <div class="player-copy">
                <span class="player-status" id="playerStatus">Play this scene</span>
                <div class="waveform" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="audiobook-dock" id="audiobookDock" aria-label="Current audiobook">
        <img class="dock-cover" id="dockCover" src="" alt="" />
        <div class="dock-copy">
          <strong class="dock-title" id="dockTitle"></strong>
          <span class="dock-author" id="dockAuthor"></span>
          <div class="dock-wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
        </div>
        <button class="dock-play-button" id="dockPlayButton" type="button" aria-label="Play current audiobook scene">
          <span class="play-icon" aria-hidden="true"></span>
        </button>
        <p class="dock-caption">Tap and hear the book in audora way</p>
      </section>

      <div class="bottom-frost" aria-hidden="true"></div>
    </main>

    <script>
      // Each book has a cover and an optional phone-page image. Add future
      // page scans to ./assets/pages/ and set `pageImage` for that story.
      const stories = [
        { title: "Sherlock Holmes", author: "Arthur Conan Doyle", cover: "./assets/covers/sherlock-holmes.png", pageImage: null, kicker: "The original illustrated stories", lines: [["Watson", "You noticed all of that from a muddy sleeve?"], ["Holmes", "I noticed what the sleeve refused to hide."], ["Watson", "And naturally, it told you everything."]] },
        { title: "Pirates", author: "Patrick Auerbach", cover: "./assets/covers/pirates.png", pageImage: null, kicker: "Pirates of the Caribbean", lines: [["Captain", "The sea is quiet tonight."], ["Quartermaster", "Quiet water can hide the deepest trouble."], ["Captain", "Then we keep our eyes on the horizon."]] },
        { title: "Dracula", author: "Bram Stoker", cover: "./assets/covers/dracula.png", pageImage: null, kicker: "A gothic classic", lines: [["Mina", "The castle seems to watch us from the hill."], ["Van Helsing", "Then we must watch it in return."], ["Mina", "Before the night discovers where we are."]] },
        { title: "Meditations", author: "Marcus Aurelius", cover: "./assets/covers/meditations.png", pageImage: "./assets/pages/meditations-page.png", kicker: "Reflections on life", lines: [["Marcus", "The obstacle is here; my judgment of it is still mine."], ["Teacher", "Then choose the judgment that lets you move forward."], ["Marcus", "And let action answer what fear cannot."]] },
        { title: "Siddhartha", author: "Hermann Hesse", cover: "./assets/covers/siddhartha.png", pageImage: "./assets/pages/siddhartha-page.png", kicker: "A journey within", lines: [["Govinda", "What did the river teach you?"], ["Siddhartha", "To listen without asking it to hurry."], ["Govinda", "Then perhaps every path is speaking."]] },
        { title: "Elon Musk", author: "Walter Isaacson", cover: "./assets/covers/elon-musk.png", pageImage: null, kicker: "A biography", lines: [["Narrator", "The next problem was described as nearly impossible."], ["Biographer", "That description often became the reason to pursue it."], ["Narrator", "The story begins where certainty ends."]] },
        { title: "Harry Potter and the Prisoner of Azkaban", author: "J. K. Rowling", cover: "./assets/covers/harry-potter-prisoner-of-azkaban.png", pageImage: null, kicker: "The third year", lines: [["Harry", "Something about this year feels different."], ["Hermione", "At Hogwarts, different usually means dangerous."], ["Harry", "Then we should probably start paying attention."]] }
      ];

      const track = document.querySelector("#carouselTrack");
      const title = document.querySelector("#storyTitle");
      const author = document.querySelector("#storyAuthor");
      const dialogue = document.querySelector("#dialogue");
      const phoneScreen = document.querySelector(".phone-screen");
      const textPage = document.querySelector("#textPage");
      const pageScan = document.querySelector("#pageScan");
      const playButton = document.querySelector("#playButton");
      const playerStatus = document.querySelector("#playerStatus");
      const audiobookDock = document.querySelector("#audiobookDock");
      const dockCover = document.querySelector("#dockCover");
      const dockTitle = document.querySelector("#dockTitle");
      const dockAuthor = document.querySelector("#dockAuthor");
      const dockPlayButton = document.querySelector("#dockPlayButton");
      let activeStory = -1;
      let playing = false;
      let speechRun = 0;

      function bookMarkup(story, index) {
        const coverImage = story.cover
          ? `<img class="book-cover-image" src="${story.cover}" alt="${story.title} book cover" decoding="async" onerror="this.remove()" />`
          : "";
        return `<article class="book" data-story="${index}" data-cover-slot="${index + 1}"><div class="book-cover cover-${index}">${coverImage}<span class="book-kicker">${story.kicker}</span><h3 class="book-title">${story.title}</h3><span class="book-author">${story.author}</span></div></article>`;
      }

      const shelf = stories.map(bookMarkup).join("");
      const continuousShelf = shelf.repeat(3);
      track.innerHTML = `<div class="carousel-set">${continuousShelf}</div><div class="carousel-set">${continuousShelf}</div>`;

      function renderStory(index) {
        if (index === activeStory || playing) return;
        activeStory = index;
        const story = stories[index];
        title.textContent = story.title;
        title.classList.toggle("is-long", story.title.length > 26);
        author.textContent = story.author;
        dialogue.innerHTML = `<p class="page-opening">The room grew quiet, and for a moment the story seemed to hold its breath.</p>` + story.lines.map(([speaker, line]) => `<p class="passage">“${line}” <span class="attribution">— ${speaker}</span></p>`).join("");
        const hasPageImage = Boolean(story.pageImage);
        phoneScreen.classList.toggle("has-page-image", hasPageImage);
        textPage.hidden = hasPageImage;
        pageScan.hidden = !hasPageImage;
        if (hasPageImage) {
          pageScan.src = story.pageImage;
          pageScan.alt = `${story.title} book page`;
        } else {
          pageScan.removeAttribute("src");
          pageScan.alt = "";
        }
        dockCover.src = story.cover;
        dockCover.alt = `${story.title} audiobook cover`;
        dockTitle.textContent = story.title;
        dockAuthor.textContent = story.author;
      }

      function findCenteredBook() {
        if (playing) return;
        const center = window.innerWidth / 2;
        let nearest = null;
        let distance = Infinity;
        document.querySelectorAll(".book").forEach((book) => {
          const rect = book.getBoundingClientRect();
          const bookDistance = Math.abs(rect.left + rect.width / 2 - center);
          if (bookDistance < distance) { distance = bookDistance; nearest = Number(book.dataset.story); }
        });
        if (nearest !== null) renderStory(nearest);
      }

      function stopPlayback() {
        speechRun += 1;
        window.speechSynthesis?.cancel();
        playing = false;
        track.classList.remove("is-paused");
        playButton.classList.remove("is-playing");
        audiobookDock.classList.remove("is-playing");
        dockPlayButton.classList.remove("is-playing");
        playButton.setAttribute("aria-label", "Play character dialogue");
        dockPlayButton.setAttribute("aria-label", "Play current audiobook scene");
        playerStatus.textContent = "Play this scene";
        dialogue.querySelectorAll(".passage").forEach((passage) => passage.classList.remove("is-speaking"));
      }

      function speakScene() {
        if (playing) { stopPlayback(); return; }
        playing = true;
        const thisRun = ++speechRun;
        track.classList.add("is-paused");
        playButton.classList.add("is-playing");
        audiobookDock.classList.add("is-playing");
        dockPlayButton.classList.add("is-playing");
        playButton.setAttribute("aria-label", "Stop character dialogue");
        dockPlayButton.setAttribute("aria-label", "Stop current audiobook scene");
        playerStatus.textContent = "Playing scene";

        const lines = stories[activeStory].lines;
        const passages = [...dialogue.querySelectorAll(".passage")];
        let lineIndex = 0;

        function nextLine() {
          if (!playing || thisRun !== speechRun) return;
          passages.forEach((passage) => passage.classList.remove("is-speaking"));
          if (lineIndex >= lines.length) { stopPlayback(); return; }
          passages[lineIndex]?.classList.add("is-speaking");
          const [speaker, line] = lines[lineIndex];
          const utterance = new SpeechSynthesisUtterance(line);
          const voices = window.speechSynthesis.getVoices();
          utterance.voice = voices[lineIndex % Math.max(voices.length, 1)] || null;
          utterance.rate = 0.92;
          utterance.pitch = lineIndex % 2 === 0 ? 1.05 : 0.88;
          playerStatus.textContent = speaker + " is speaking";
          dockPlayButton.setAttribute("aria-label", `${speaker} is speaking. Stop current audiobook scene`);
          utterance.onend = () => { lineIndex += 1; nextLine(); };
          utterance.onerror = stopPlayback;
          window.speechSynthesis.speak(utterance);
        }

        if (!("speechSynthesis" in window)) {
          playerStatus.textContent = "Audio unavailable";
          dockPlayButton.setAttribute("aria-label", "Audio unavailable");
          window.setTimeout(stopPlayback, 1800);
          return;
        }
        nextLine();
      }

      playButton.addEventListener("click", speakScene);
      dockPlayButton.addEventListener("click", speakScene);
      window.addEventListener("resize", findCenteredBook);
      window.setInterval(findCenteredBook, 240);
      document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stopPlayback(); });
      renderStory(0);
      window.setTimeout(findCenteredBook, 100);
    </script>
  </body>
</html>
