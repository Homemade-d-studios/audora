<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Step inside a story and listen to its characters come alive." />
    <title>Audora — Stories in conversation</title>
    <style>
      :root {
        --ink: #171717;
        --muted: #6d6d68;
        --paper: #ffffff;
        --mockup-width: clamp(620px, 52vw, 760px);
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: var(--paper); }
      body {
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow-x: hidden;
      }
      button { font: inherit; }

      .experience {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .carousel-window {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 0;
        width: 100%;
        transform: translateY(-50%);
      }
      .carousel-window::before, .carousel-window::after {
        position: absolute;
        z-index: 3;
        top: -20%;
        bottom: -20%;
        width: min(10vw, 150px);
        content: "";
        pointer-events: none;
      }
      .carousel-window::before { left: 0; background: linear-gradient(90deg, var(--paper), transparent); }
      .carousel-window::after { right: 0; background: linear-gradient(-90deg, var(--paper), transparent); }
      .carousel-track {
        display: flex;
        width: max-content;
        will-change: transform;
        animation: drift 44s linear infinite;
      }
      .carousel-track.is-paused { animation-play-state: paused; }
      .carousel-set {
        display: flex;
        gap: clamp(24px, 2.5vw, 42px);
        padding-right: clamp(24px, 2.5vw, 42px);
      }

      .book {
        position: relative;
        flex: 0 0 auto;
        width: clamp(120px, 10.5vw, 164px);
        aspect-ratio: 0.68;
        overflow: hidden;
        border: 1px solid rgba(20, 20, 20, 0.14);
        border-radius: 5px 12px 12px 5px;
        box-shadow: 0 16px 28px rgba(28, 28, 24, 0.11), inset 8px 0 12px rgba(255, 255, 255, 0.18), inset -3px 0 0 rgba(0, 0, 0, 0.12);
        transform: perspective(700px) rotateY(5deg);
      }
      .book::before {
        position: absolute;
        z-index: 2;
        inset: 0 auto 0 0;
        width: 9px;
        border-right: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.12);
        content: "";
      }
      .book-cover {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 14px 14px 20px;
      }
      .book-kicker { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; opacity: 0.75; text-transform: uppercase; }
      .book-title {
        max-width: 95%;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 1.55vw, 25px);
        font-weight: 400;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .book-author { font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
      .cover-0 { color: #241d16; background: linear-gradient(155deg, #e9d9b9, #b99863); }
      .cover-1 { color: #f4ead8; background: linear-gradient(150deg, #435365, #152331); }
      .cover-2 { color: #2b1b22; background: linear-gradient(155deg, #dbb2b7, #965c6b); }
      .cover-3 { color: #14312c; background: linear-gradient(155deg, #c7e1d5, #6e9c87); }
      .cover-4 { color: #f5dfbb; background: linear-gradient(155deg, #774b3f, #2d2422); }
      .cover-5 { color: #283019; background: linear-gradient(155deg, #dbe2a1, #87964f); }
      .cover-6 { color: #fff0cf; background: linear-gradient(155deg, #ce713b, #71361e); }

      .phone-wrap {
        position: relative;
        z-index: 3;
        width: var(--mockup-width);
        aspect-ratio: 1376 / 1143;
      }
      .phone-photo {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .screen-overlay {
        position: absolute;
        z-index: 2;
        top: 5.9%;
        left: 35.2%;
        width: 30.1%;
        height: 79.5%;
        overflow: hidden;
        border-radius: 11.5% / 5.3%;
        background: #fffdf7;
      }
      .phone-screen { display: flex; height: 100%; flex-direction: column; padding: 22px 13px 12px; }
      .page-folio { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid #d8d8d2; color: #8a8a84; font-family: Georgia, "Times New Roman", serif; font-size: 8px; font-style: italic; letter-spacing: 0.06em; }
      .story-heading { padding: 15px 0 10px; text-align: center; }
      .story-label { display: block; margin-bottom: 6px; color: #777770; font-family: Georgia, "Times New Roman", serif; font-size: 9px; font-style: italic; }
      .story-title { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(18px, 1.35vw, 22px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.05; }
      .story-heading::after { display: block; margin-top: 8px; color: #898982; content: "❦"; font-family: Georgia, serif; font-size: 11px; }

      .dialogue { min-height: 0; flex: 1; color: #282823; font-family: Georgia, "Times New Roman", serif; font-size: clamp(9px, 0.68vw, 11px); line-height: 1.42; overflow: hidden; }
      .page-opening { margin: 0 0 10px; text-indent: 1.2em; }
      .page-opening::first-letter { float: left; margin: 0.06em 0.08em 0 0; font-size: 3.1em; line-height: 0.78; }
      .passage { margin: 0 0 9px; text-indent: 1.2em; transition: background 180ms ease; }
      .passage.is-speaking { border-radius: 3px; background: #f3efdc; }
      .attribution { color: #707069; font-size: 0.88em; font-style: italic; white-space: nowrap; }

      .player { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; padding-top: 11px; border-top: 1px solid #d8d8d2; }
      .play-button { display: grid; width: 36px; height: 36px; padding: 0; place-items: center; border: 0; border-radius: 50%; color: #fff; background: #1f211e; cursor: pointer; transition: transform 160ms ease, background 160ms ease; }
      .play-button:hover { background: #070807; transform: scale(1.04); }
      .play-button:focus-visible { outline: 3px solid rgba(57, 82, 62, 0.35); outline-offset: 3px; }
      .play-icon { width: 0; height: 0; margin-left: 3px; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid currentColor; }
      .play-button.is-playing .play-icon { width: 11px; height: 13px; margin-left: 0; border: 0; border-right: 4px solid currentColor; border-left: 4px solid currentColor; }
      .player-copy { min-width: 0; }
      .player-status { display: block; margin-bottom: 7px; color: #5d5f59; font-size: 9px; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
      .waveform { display: flex; height: 16px; align-items: center; gap: 3px; }
      .waveform span { width: 3px; height: 4px; border-radius: 3px; background: #9b9d95; }
      .is-playing + .player-copy .waveform span { animation: pulse 700ms ease-in-out infinite alternate; }
      .waveform span:nth-child(2n) { height: 11px; animation-delay: -160ms !important; }
      .waveform span:nth-child(3n) { height: 7px; animation-delay: -320ms !important; }

      @keyframes drift { from { transform: translateX(-50%); } to { transform: translateX(0); } }
      @keyframes pulse { from { transform: scaleY(0.45); } to { transform: scaleY(1.35); } }

      @media (max-height: 760px) and (min-width: 700px) {
        :root { --mockup-width: 570px; }
      }
      @media (max-width: 620px) {
        :root { --mockup-width: 720px; }
        .experience { min-height: 680px; }
        .book { width: 112px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .carousel-track, .is-playing + .player-copy .waveform span { animation-play-state: paused; }
      }
    </style>
  </head>
  <body>
    <main class="experience">
      <div class="carousel-window" aria-hidden="true">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>

      <div class="phone-wrap" aria-label="iPhone 16 Pro audiobook preview">
        <img
          class="phone-photo"
          src="./assets/phone-hand-blank.png"
          alt=""
          aria-hidden="true"
        />
        <div class="screen-overlay">
          <div class="phone-screen">
            <div class="page-folio" aria-hidden="true">
              <span>Chapter XII</span>
              <span>147</span>
            </div>
            <div class="story-heading">
              <span class="story-label" id="storyAuthor"></span>
              <h2 class="story-title" id="storyTitle"></h2>
            </div>
            <div class="dialogue" id="dialogue" aria-live="polite"></div>
            <div class="player">
              <button class="play-button" id="playButton" type="button" aria-label="Play character dialogue">
                <span class="play-icon" aria-hidden="true"></span>
              </button>
              <div class="player-copy">
                <span class="player-status" id="playerStatus">Play this scene</span>
                <div class="waveform" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const stories = [
        { title: "Pride and Prejudice", author: "Jane Austen", kicker: "A novel of manners", lines: [["Elizabeth", "You mistake my silence for agreement."], ["Darcy", "Then tell me what your silence means."], ["Elizabeth", "That I am still deciding whether you deserve an answer."]] },
        { title: "The Odyssey", author: "Homer", kicker: "An epic journey", lines: [["Athena", "The sea tests more than a sailor's strength."], ["Odysseus", "Then let it test my patience too."], ["Athena", "Patience may be the wind that carries you home."]] },
        { title: "Little Women", author: "Louisa May Alcott", kicker: "Four sisters", lines: [["Jo", "I want a life too large for a tidy little page."], ["Beth", "Then write past the edge of it."], ["Jo", "Perhaps that is exactly what I will do."]] },
        { title: "Alice's Adventures", author: "Lewis Carroll", kicker: "Down the rabbit hole", lines: [["Alice", "Nothing here seems to stay the right size."], ["Cheshire Cat", "Perhaps size is only a matter of where you stand."], ["Alice", "Then I should like to stand somewhere sensible."]] },
        { title: "Frankenstein", author: "Mary Shelley", kicker: "A modern Prometheus", lines: [["Creature", "You gave me a voice, yet feared what I might say."], ["Victor", "I feared what my ambition had made."], ["Creature", "And I feared being left alone with it."]] },
        { title: "The Secret Garden", author: "Frances Hodgson Burnett", kicker: "A hidden world", lines: [["Mary", "Do you think the garden remembers us?"], ["Colin", "It remembered how to grow."], ["Mary", "Then perhaps we can remember too."]] },
        { title: "Sherlock Holmes", author: "Arthur Conan Doyle", kicker: "A curious case", lines: [["Watson", "You noticed all of that from a muddy sleeve?"], ["Holmes", "I noticed what the sleeve refused to hide."], ["Watson", "And naturally, it told you everything."]] }
      ];

      const track = document.querySelector("#carouselTrack");
      const title = document.querySelector("#storyTitle");
      const author = document.querySelector("#storyAuthor");
      const dialogue = document.querySelector("#dialogue");
      const playButton = document.querySelector("#playButton");
      const playerStatus = document.querySelector("#playerStatus");
      let activeStory = -1;
      let playing = false;
      let speechRun = 0;

      function bookMarkup(story, index) {
        return `<article class="book" data-story="${index}"><div class="book-cover cover-${index}"><span class="book-kicker">${story.kicker}</span><h3 class="book-title">${story.title}</h3><span class="book-author">${story.author}</span></div></article>`;
      }

      const shelf = stories.map(bookMarkup).join("");
      track.innerHTML = `<div class="carousel-set">${shelf}</div><div class="carousel-set">${shelf}</div>`;

      function renderStory(index) {
        if (index === activeStory || playing) return;
        activeStory = index;
        const story = stories[index];
        title.textContent = story.title;
        author.textContent = story.author;
        dialogue.innerHTML = `<p class="page-opening">The room grew quiet, and for a moment the story seemed to hold its breath.</p>` + story.lines.map(([speaker, line]) => `<p class="passage">“${line}” <span class="attribution">— ${speaker}</span></p>`).join("");
      }

      function findCenteredBook() {
        if (playing) return;
        const center = window.innerWidth / 2;
        let nearest = null;
        let distance = Infinity;
        document.querySelectorAll(".book").forEach((book) => {
          const rect = book.getBoundingClientRect();
          const bookDistance = Math.abs(rect.left + rect.width / 2 - center);
          if (bookDistance < distance) { distance = bookDistance; nearest = Number(book.dataset.story); }
        });
        if (nearest !== null) renderStory(nearest);
      }

      function stopPlayback() {
        speechRun += 1;
        window.speechSynthesis?.cancel();
        playing = false;
        track.classList.remove("is-paused");
        playButton.classList.remove("is-playing");
        playButton.setAttribute("aria-label", "Play character dialogue");
        playerStatus.textContent = "Play this scene";
        dialogue.querySelectorAll(".passage").forEach((passage) => passage.classList.remove("is-speaking"));
      }

      function speakScene() {
        if (playing) { stopPlayback(); return; }
        playing = true;
        const thisRun = ++speechRun;
        track.classList.add("is-paused");
        playButton.classList.add("is-playing");
        playButton.setAttribute("aria-label", "Stop character dialogue");
        playerStatus.textContent = "Playing scene";

        const lines = stories[activeStory].lines;
        const passages = [...dialogue.querySelectorAll(".passage")];
        let lineIndex = 0;

        function nextLine() {
          if (!playing || thisRun !== speechRun) return;
          passages.forEach((passage) => passage.classList.remove("is-speaking"));
          if (lineIndex >= lines.length) { stopPlayback(); return; }
          passages[lineIndex]?.classList.add("is-speaking");
          const [speaker, line] = lines[lineIndex];
          const utterance = new SpeechSynthesisUtterance(line);
          const voices = window.speechSynthesis.getVoices();
          utterance.voice = voices[lineIndex % Math.max(voices.length, 1)] || null;
          utterance.rate = 0.92;
          utterance.pitch = lineIndex % 2 === 0 ? 1.05 : 0.88;
          playerStatus.textContent = speaker + " is speaking";
          utterance.onend = () => { lineIndex += 1; nextLine(); };
          utterance.onerror = stopPlayback;
          window.speechSynthesis.speak(utterance);
        }

        if (!("speechSynthesis" in window)) {
          playerStatus.textContent = "Audio unavailable";
          window.setTimeout(stopPlayback, 1800);
          return;
        }
        nextLine();
      }

      playButton.addEventListener("click", speakScene);
      window.addEventListener("resize", findCenteredBook);
      window.setInterval(findCenteredBook, 240);
      document.addEventListener("visibilitychange", () => { if (document.hidden && playing) stopPlayback(); });
      renderStory(0);
      window.setTimeout(findCenteredBook, 100);
    </script>
  </body>
</html>
